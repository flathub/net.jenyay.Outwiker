app-id: net.jenyay.Outwiker
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: outwiker
rename-icon: net.jenyay.Outwiker
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=host
modules:
  - python3-requirements.json

  - name: outwiker
    buildsystem: simple
    no-autogen: true
    sources:
      - type: git
        url: https://github.com/Jenyay/outwiker
        commit: 4458beaebd56cafd4d30665bd49ddf1e5b1bbc72
    build-commands:
      - make -f Makefile.flatpak install
