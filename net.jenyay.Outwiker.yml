app-id: net.jenyay.Outwiker
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: outwiker
rename-icon: net.jenyay.Outwiker
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=host
modules:
  - python3-requirements.json
  - wxpython.json
  - name: outwiker
    buildsystem: simple
    no-autogen: true
    sources:
      - type: git
        url: https://github.com/Jenyay/outwiker
        commit: 16089ae6407970d6d18f8aa758a2aaf75a4b9cd6
      - type: file
        path: Makefile
      - type: file
        path: outwiker
    build-commands:
      - make install
