app-id: net.jenyay.Outwiker
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: outwiker
rename-icon: net.jenyay.Outwiker
finish-args:
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=host
  - --env=PYTHONPATH=/app/lib/python3.12/site-packages
modules:
  - name: python312
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --enable-optimizations --with-ensurepip=install
      - make -j$(nproc)
      - make install
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.12.7/Python-3.12.7.tgz
        sha256: 73ac8fe780227bf371add8373c3079f42a0dc62deff8d612cd15a618082ab623

  - python3-setuptools.json

  - name: debug-info
    buildsystem: simple
    build-options:
      env:
        PYTHONPATH: /app/lib/python3.12/site-packages
    build-commands:
      - python3.12 --version
      - echo "PYTHONPATH is: $PYTHONPATH"
      - echo "FLATPAK_DEST is: $FLATPAK_DEST"
      - python3.12 -m pip list

  - python3-requirements.json

  - name: chunspell_fork_fork
    buildsystem: simple
    build-options:
      env:
        PYTHONPATH: /app/lib/python3.12/site-packages
    sources:
      - type: git
        url: https://github.com/Jenyay/chunspell_fork_fork
        commit: 1e2ac992e78a25c38c441d706939c1459a176aa9
    build-commands:
      - python3.12 -m pip install . --prefix=${FLATPAK_DEST} --no-build-isolation

  - name: outwiker
    buildsystem: simple
    no-autogen: true
    build-options:
      env:
        PYTHONPATH: /app/lib/python3.12/site-packages
    sources:
      - type: git
        url: https://github.com/Jenyay/outwiker
        commit: 1966acfe3f6358dec9e4c7b55caa63eb0492e27a
    build-commands:
      - make -f Makefile.flatpak install
