app-id: net.jenyay.Outwiker
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: outwiker
rename-icon: net.jenyay.Outwiker
finish-args:
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=host
modules:
  # Borrowed from: https://github.com/flathub/in.cinny.Cinny/blob/master/in.cinny.Cinny.yml

  - name: unifdef
    no-autogen: true
    make-install-args:
      - prefix=${FLATPAK_DEST}

    sources:
      - type: archive
        url: https://dotat.at/prog/unifdef/unifdef-2.12.tar.xz
        sha256: 43ce0f02ecdcdc723b2475575563ddb192e988c886d368260bc0a63aee3ac400
    cleanup:
      - '*'
  - name: python3-setuptools
    buildsystem: simple
    build-commands:
      - python3 setup.py install --prefix=/app
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/18/5d/3bf57dcd21979b887f014ea83c24ae194cfcd12b9e0fda66b957c69d1fca/setuptools-80.9.0.tar.gz
        sha256: f36b47402ecde768dbfafc46e8e4207b4360c654f1f3bb84475f0a28628fb19c
  - name: python3-wheel
    buildsystem: simple
    build-commands:
      - python3 setup.py install --prefix=/app
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/8a/98/2d9906746cdc6a6ef809ae6338005b3f21bb568bea3165cfc6a243fdc25c/wheel-0.45.1.tar.gz
        sha256: 661e1abd9198507b1409a20c02106d9670b2576e916d58f520316666abca6729
  - python3-requirements.json
  - name: outwiker
    buildsystem: simple
    no-autogen: true
    sources:
      - type: git
        url: https://github.com/Jenyay/outwiker
        commit: d824da4473673e3bd7ae652ba8e1742aff9270fd
    build-commands:
      - make -f Makefile.flatpak install
  #- name: cacheman
  #  buildsystem: simple
  #  build-commands:
  #    - python -m pip install . --prefix=${FLATPAK_DEST}
  #  sources:
  #    - type: git
  #      url: https://github.com/Jenyay/py_cache_manager
  #      commit: 57818fde53892d4ba12f97e77eace70c6ad9a387
  - name: cyhunspell
    buildsystem: simple
    build-commands:
      - ls -R /app/lib/python*/site-packages | grep setuptools
      - python -c "import setuptools; print(setuptools.__version__)"
      #- python -m pip install . --prefix=${FLATPAK_DEST}
      - python3 setup.py install --prefix=${FLATPAK_DEST}
    sources:
      - type: git
        url: https://github.com/Jenyay/cython_hunspell
        commit: 76a620875ba681a800b0f5ab2be16bf684bae385
