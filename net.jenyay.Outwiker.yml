app-id: net.jenyay.Outwiker
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: outwiker
rename-icon: net.jenyay.Outwiker
finish-args:
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=host
modules:
  # Borrowed from: https://github.com/flathub/in.cinny.Cinny/blob/master/in.cinny.Cinny.yml

  - name: unifdef
    no-autogen: true
    make-install-args:
      - prefix=${FLATPAK_DEST}
    sources:
      - type: archive
        url: https://dotat.at/prog/unifdef/unifdef-2.12.tar.xz
        sha256: 43ce0f02ecdcdc723b2475575563ddb192e988c886d368260bc0a63aee3ac400
    cleanup:
      - '*'

  - python3-requirements.json

  - name: chunspell_fork_fork
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/Jenyay/chunspell_fork_fork
        commit: 1e2ac992e78a25c38c441d706939c1459a176aa9
    build-commands:
      - python -m pip install . --prefix=${FLATPAK_DEST} --no-build-isolation

  - name: outwiker
    buildsystem: simple
    no-autogen: true
    sources:
      - type: git
        url: https://github.com/Jenyay/outwiker
        commit: 8de7b913b1ad196f26cea4ab8ea15460477e55b4
    build-commands:
      - make -f Makefile.flatpak install
